apiVersion: v1
data:
  POSTGRES_DB: postgresdb
  POSTGRES_PASSWORD: password
  POSTGRES_USER: admin
  SPRING_DATASOURCE_PASSWORD: password
  SPRING_DATASOURCE_URL: jdbc:postgresql://ledger-db:5432/postgresdb
  SPRING_DATASOURCE_USERNAME: admin
kind: ConfigMap
metadata:
  labels:
    app: ledger-db
  name: ledger-db-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ledger-db
  name: ledger-db
spec:
  ports:
  - name: tcp
    port: 5432
    targetPort: 5432
  selector:
    app: ledger-db
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: ledger-db
  name: ledger-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-db
  serviceName: ledger-db
  template:
    metadata:
      labels:
        app: ledger-db
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: ledger-db-config
        image: gcr.io/bank-of-anthos-ci/ledger-db:v0.6.5@sha256:59b394e4f02b2d1d3e62b74bbb7fe65b0eeab3d76e02bb9733ea3abbb0cbe67d
        name: ledger-db
        ports:
        - containerPort: 5432
          name: tcp
        resources:
          limits:
            cpu: 250m
            ephemeral-storage: 0.5Gi
            memory: 512Mi
          requests:
            cpu: 100m
            ephemeral-storage: 0.5Gi
            memory: 128Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgresdb
          subPath: postgres
      serviceAccountName: default
  volumeClaimTemplates:
  - metadata:
      name: postgresdb
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi